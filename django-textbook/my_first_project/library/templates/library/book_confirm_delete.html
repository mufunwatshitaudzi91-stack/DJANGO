{% extends 'library/base.html' %}

{% block title %}Delete {{ book.title }} - My Library{% endblock %}

{% block content %}
    <h1>Delete "{{ book.title }}"?</h1>
    <div class="card">
        <p>This permanently deletes the book. It can't be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Yes, delete it</button>
            <a href="{% url 'library:book-detail' book.pk %}">Cancel</a>
        </form>
    </div>
{% endblock %}
